name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual trigger doubles as the keepalive's "recent activity" nudge — GitHub
  # disables scheduled workflows after 60 days without commits to the default
  # branch, and a manual run resets nothing, so commit occasionally too.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; cancel an in-flight one if a newer push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the local toolchain (Node 24), so a version-specific failure
          # surfaces on the machine you can actually debug on.
          node-version: 24
          cache: npm

      - run: npm ci

      # Analytics feeds alerts, AI verdicts and every chart. A wrong RSI here
      # corrupts all three silently, so a red suite must block the deploy.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Safe to expose: the anon key is designed to be public and RLS is the
          # real boundary. Every other key lives in Supabase Edge Function secrets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Must match the repo name, or every asset 404s on the deployed site.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages has no SPA rewrite rule. Serving the same document as the
      # 404 page makes React Router resolve deep links like /notifications on a
      # hard refresh instead of showing GitHub's 404.
      - name: SPA deep-link fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
